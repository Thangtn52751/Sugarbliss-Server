<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Admin Products</title>
    <link rel="stylesheet" href="/assets/css/admin.css">
    <link rel="stylesheet" href="/assets/css/admin-products.css">
    <script src="/assets/js/api-config.js" defer></script>
    <script src="/assets/js/admin-shell.js" defer></script>
    <script src="/assets/js/admin-products.js" defer></script>
</head>
<body class="admin-page">
    <sugar-admin-sidebar active="products"></sugar-admin-sidebar>

    <main class="admin-main" aria-label="Products">
        <div class="admin-access-state" data-admin-access-state role="status">Loading...</div>
        
        <div class="admin-content" data-admin-content hidden>
            <div class="admin-page-header" style="align-items: center;">
                <div class="header-titles">
                    <h1 data-page-title>Products</h1>
                    <p data-page-subtitle style="margin: 6px 0 0; color: var(--admin-muted); font-size: 13px;">Manage your blissful dessert menu and stock availability</p>
                </div>
                <div class="header-actions">
                    <div class="search-box" data-product-action>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#93848b" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" placeholder="Search product by name...">
                    </div>
                    <button class="btn-add" id="btn-open-add-modal" data-product-action>+ Add New Product</button>
                    <button class="btn-add" id="btn-open-category-create" data-category-action hidden>+ Add Category</button>
                </div>
            </div>

            <nav class="admin-content-tabs" role="tablist" aria-label="Admin content">
                <button type="button" class="admin-content-tab active" role="tab" aria-selected="true" aria-controls="products-tab" data-admin-tab="products">Products</button>
                <button type="button" class="admin-content-tab" role="tab" aria-selected="false" aria-controls="categories-tab" data-admin-tab="categories">Categories</button>
            </nav>

            <section id="products-tab" class="admin-tab-panel" role="tabpanel" data-admin-panel="products">
            <div class="admin-panel" style="padding: 0; overflow: hidden;">
                <div class="admin-table-scroll">
                    <table class="admin-data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price (VND)</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body">
                            <tr><td colspan="7" style="text-align:center; padding: 20px;">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination-wrapper">
                    <div class="showing-text" id="pagination-info">Showing 0 items</div>
                    <div class="pagination-controls" id="pagination-controls"></div>
                </div>
            </div>
            </section>

            <section id="categories-tab" class="admin-tab-panel" role="tabpanel" data-admin-panel="categories" hidden>
                <div class="admin-panel" style="padding:0; overflow:hidden">
                    <div class="admin-table-scroll">
                        <table class="admin-data-table">
                            <thead><tr><th>Category</th><th>Slug</th><th style="text-align:right">Actions</th></tr></thead>
                            <tbody id="category-table-body"><tr><td colspan="3" class="admin-tab-empty">Select Categories to load data.</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Modal Form Thêm / Sửa Sản Phẩm -->
    <div class="modal-overlay" id="product-modal" hidden>
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Add New Product</h3>
                <button class="btn-close" id="btn-close-modal">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" required placeholder="e.g. Strawberry Shortcake">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prod-description" rows="3" required placeholder="Enter product description..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-weightGram">Weight (g)</label>
                        <input type="number" id="prod-weightGram" min="0" step="any" placeholder="300">
                    </div>
                    <div class="form-group">
                        <label for="prod-shelfLifeDays">Shelf life (days)</label>
                        <input type="number" id="prod-shelfLifeDays" min="0" step="1" placeholder="3">
                    </div>
                </div>
                <div class="form-group">
                    <label for="prod-ingredients">Ingredients</label>
                    <textarea id="prod-ingredients" rows="2" placeholder="Flour, butter, milk"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-category">Category</label>
                        <div style="display:flex; gap:8px"><select id="prod-category" required style="flex:1"><option value="">Select a category</option></select><button type="button" class="btn-add" id="btn-add-category" style="white-space:nowrap">+ Category</button></div>
                    </div>
                    <div class="form-group">
                        <label>Price (VND)</label>
                        <input type="number" id="prod-price" required placeholder="50000">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-stock">Product quantity</label>
                        <input type="number" id="prod-stock" value="100" min="0" max="9007199254740991" step="1" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="prod-status">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="out-of-stock">Out of stock</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="product-image-heading"><label for="prod-image">Product images</label><button type="button" class="product-clear-images" id="btn-clear-product-images" title="Clear selected files" aria-label="Clear selected files" hidden>&times;</button></div>
                    <input type="file" id="prod-image" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple required title="JPG, PNG, WebP or GIF. Up to 10 images, 5 MB each." aria-describedby="product-image-error">
                    <div class="product-image-previews" id="product-image-previews" aria-label="Product image previews" hidden></div>
                    <p class="product-form-error" id="product-image-error" role="alert" hidden></p>
                </div>
                <p class="product-form-error" id="product-form-error" role="alert" hidden></p>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn-save">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Xem Chi Tiết Sản Phẩm -->
    <div class="modal-overlay" id="product-detail-modal" hidden>
        <div class="modal-box modal-detail-box">
            <div class="modal-header">
                <h3>Product Detail</h3>
                <button class="btn-close" id="btn-close-detail-modal">&times;</button>
            </div>
            <div class="detail-popup-body" id="detail-popup-content"></div>
            <div class="modal-actions" style="margin-top: 20px;">
                <button type="button" class="btn-cancel" id="btn-close-detail-bottom">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
