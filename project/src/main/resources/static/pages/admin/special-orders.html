<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Admin Special Orders</title>
    <link rel="stylesheet" href="/assets/css/admin.css">
    <link rel="stylesheet" href="/assets/css/admin-orders.css">
    <link rel="stylesheet" href="/assets/css/admin-special-orders.css">
    <script src="/assets/js/api-config.js" defer></script>
    <script src="/assets/js/admin-shell.js" defer></script>
    <script src="/assets/js/admin-special-orders.js" defer></script>
</head>
<body class="admin-page">
    <sugar-admin-sidebar active="special-orders"></sugar-admin-sidebar>
    <main class="admin-main" aria-label="Special Orders">
        <div class="admin-access-state" data-admin-access-state role="status">Loading...</div>
        <div class="admin-content" data-admin-content hidden>
            <header class="admin-page-header orders-header">
                <h1>Special Orders</h1>
                <div class="orders-filters" role="search">
                    <label>
                        <span class="admin-sr-only">Search request, customer, or email</span>
                        <input type="search" maxlength="120" placeholder="Search request..." data-so-search>
                    </label>
                    <label>
                        <span class="admin-sr-only">Request status</span>
                        <select data-so-status>
                            <option value="">Status: All</option>
                            <option>Pending</option>
                            <option>Reviewing</option>
                            <option>Quoted</option>
                            <option>Approved</option>
                            <option>Completed</option>
                            <option>Cancelled</option>
                        </select>
                    </label>
                    <button type="button" class="orders-icon-button" data-so-clear title="Clear filters" aria-label="Clear filters" hidden>&times;</button>
                </div>
            </header>
            <p class="orders-feedback" data-so-feedback role="status" hidden></p>
            <div class="orders-table-scroll" data-so-table aria-busy="false">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Request</th>
                            <th>Customer</th>
                            <th>Delivery</th>
                            <th>Submitted</th>
                            <th>Status</th>
                            <th class="orders-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody data-so-rows>
                        <tr><td colspan="6" class="orders-empty">Loading special orders...</td></tr>
                    </tbody>
                </table>
            </div>
            <footer class="orders-pagination">
                <span data-so-pagination-info role="status"></span>
                <nav data-so-pages aria-label="Special order pages"></nav>
                <button type="button" class="orders-secondary" data-so-retry hidden>Retry</button>
            </footer>
        </div>
    </main>
    <dialog class="orders-dialog" data-so-dialog aria-labelledby="so-dialog-title">
        <header>
            <h2 id="so-dialog-title" data-so-title>Special order</h2>
            <button type="button" class="orders-icon-button" data-so-close title="Close" aria-label="Close">&times;</button>
        </header>
        <div data-so-details></div>
        <p class="orders-feedback" data-so-detail-feedback role="status" hidden></p>
        <form class="orders-pickup-form" data-so-form>
            <label>Status
                <select name="status" data-so-edit-status required></select>
            </label>
            <label>Admin note
                <textarea name="adminNote" maxlength="1000" rows="4" placeholder="Internal note for the team" data-so-edit-note></textarea>
            </label>
            <button class="orders-primary" type="submit" data-so-save>Save changes</button>
        </form>
        <footer>
            <button type="button" class="orders-secondary" data-so-dismiss>Close</button>
        </footer>
    </dialog>
</body>
</html>
