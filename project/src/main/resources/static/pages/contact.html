<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Contact</title>
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/form-pages.css">
</head>
<body>
    <sugar-header active="contact"></sugar-header>

    <main class="form-page">
        <div class="form-page-inner">
            <div class="form-heading">
                <h1>Let's Get In Touch</h1>
                <p>Have a question about flavors, custom cakes, or store hours? We would love to hear from you.</p>
                <p>Send us a note and our team will get back to you as soon as we can.</p>
            </div>

            <form class="bliss-form" data-bliss-form="contact" novalidate>
                <label class="bliss-field">
                    <span class="sr-only">Your Name</span>
                    <input type="text" name="name" placeholder="Your Name" autocomplete="name" required>
                </label>

                <label class="bliss-field">
                    <span class="sr-only">Your Email</span>
                    <input type="email" name="email" placeholder="Your Email" autocomplete="email" required>
                </label>

                <label class="bliss-field">
                    <span class="sr-only">Your Message</span>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                </label>

                <p class="form-message" data-form-message></p>

                <div class="bliss-submit">
                    <button class="submit-button" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </main>

    <sugar-footer variant="form"></sugar-footer>
    <script src="/assets/js/api-config.js"></script>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/form-pages.js"></script>
</body>
</html>
