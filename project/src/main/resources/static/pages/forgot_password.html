<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Forgot Password</title>
    <link rel="stylesheet" href="/assets/css/reset-password.css">
</head>
<body>
    <main class="reset-page">
        <section class="reset-panel">
            <div class="reset-card">
                <a class="mini-brand" href="/login" aria-label="Sugar Bliss login">
                    <img src="/assets/icons/logo.png" alt="Sugar Bliss logo">
                    <span>Sugar Bliss</span>
                </a>

                <h1>Forgot Password?</h1>
                <p>Please enter your email so we can send you a code.</p>

                <form class="reset-form" data-reset-page="forgot">
                    <label class="reset-field">
                        <img class="field-icon image-icon" src="/assets/icons/ic_mail.png" alt="" aria-hidden="true">
                        <input type="email" name="email" placeholder="Your Email" autocomplete="email" required>
                    </label>

                    <button class="reset-button" type="submit">Submit</button>
                </form>

                <p class="reset-message" data-reset-message></p>
            </div>
        </section>
    </main>

    <sugar-footer variant="reset"></sugar-footer>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/password-reset.js"></script>
</body>
</html>
