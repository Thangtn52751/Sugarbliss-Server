<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | New Password</title>
    <link rel="stylesheet" href="/assets/css/reset-password.css">
</head>
<body>
    <main class="reset-page">
        <section class="reset-panel">
            <div class="reset-card">
                <a class="mini-brand" href="/login" aria-label="Sugar Bliss login">
                    <img src="/assets/icons/logo.png" alt="Sugar Bliss logo">
                    <span>Sugar Bliss</span>
                </a>

                <h1>New Password</h1>
                <p>Set a strong password to secure your Sugar Bliss account.</p>

                <form class="reset-form" data-reset-page="new-password">
                    <label class="reset-field">
                        <span class="field-icon lock-icon" aria-hidden="true"></span>
                        <input type="password" name="password" placeholder="New Password" autocomplete="new-password" required minlength="6">
                    </label>

                    <label class="reset-field">
                        <span class="field-icon lock-icon" aria-hidden="true"></span>
                        <input type="password" name="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required minlength="6">
                    </label>

                    <button class="reset-button" type="submit">Save & Continue</button>
                </form>

                <p class="reset-message" data-reset-message></p>
            </div>
        </section>
    </main>

    <sugar-footer variant="reset"></sugar-footer>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/password-reset.js"></script>
</body>
</html>
