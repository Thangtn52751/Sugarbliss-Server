<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Product Detail</title>
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/product-detail.css">
</head>
<body>
    <sugar-header active="products"></sugar-header>

    <main class="page-shell">
        <div class="detail-container">
            <div class="detail-images">
                <div class="main-image">
                    <img id="main-product-image" src="/assets/images/cake1.png" alt="Product Image">
                </div>
                <div class="thumbnail-list" id="product-thumbnail-list" aria-label="Product images"></div>
            </div>

            <div class="detail-info">
                <span class="detail-label" data-i18n="detail.label">Product Detail</span>
                
                <h1 class="detail-title" id="product-title-price"></h1>
                
                <ul class="detail-specs">
                    <li>⚖️ <span data-i18n="detail.weight">Weight:</span> <span id="product-weight"></span></li>
                    <li>📅 <span data-i18n="detail.exp">Expiration date:</span> <span id="product-exp"></span></li>
                    <li>🌾 <span data-i18n="detail.ingredient">Ingredient:</span> <span id="product-ingredients"></span></li>
                </ul>

                <div class="detail-description">
                    <h3 data-i18n="detail.description">Description</h3>
                    <p id="product-desc"></p>
                </div>

                <p class="product-availability" id="product-availability" role="status" hidden></p>
                <div class="detail-actions">
                    <div class="quantity-selector">
                        <button type="button" onclick="updateQty(-1)" aria-label="Decrease quantity" disabled>&minus;</button>
                        <input type="number" id="qty-input" value="1" min="1" readonly disabled>
                        <button type="button" onclick="updateQty(1)" aria-label="Increase quantity" disabled>+</button>
                    </div>
                    <button class="btn-favourite" id="favorite-detail-button" type="button" aria-pressed="false" data-i18n="detail.favourites">&#9825; Favourites</button>
                    <button class="btn-add-cart" type="button" onclick="addProductToCart(this)" data-i18n="detail.addToCart" disabled>Add To Cart</button>
                </div>
            </div>
        </div>

        <div class="related-section">
            <div class="related-header">
                <h2 data-i18n="detail.relatedTitle">Product you may like</h2>
            </div>
            <div class="related-grid" id="related-products">
            </div>
        </div>

        <!-- Khối Customer Reviews Chuyên Nghiệp -->
        <section class="reviews-section">
            <div class="reviews-header-block">
                <h2 data-i18n="detail.reviewsTitle">Customer Reviews</h2>
                <p class="reviews-subtitle">Real experiences and feedback from our sweet lovers</p>
            </div>
            
            <div class="reviews-container">
                <!-- Summary Card Left -->
                <div class="reviews-summary">
                    <div class="summary-score-wrapper">
                        <div class="summary-score" id="summary-score">0.0</div>
                        <div class="summary-score-max">/ 5.0</div>
                    </div>
                    
                    <div class="summary-stars-overview" id="summary-stars-overview" aria-hidden="true">★★★★★</div>
                    <div class="summary-count" id="summary-count">Based on 0 reviews</div>

                    <!-- Breakdown Progress Bars -->
                    <div class="rating-breakdown" id="rating-breakdown">
                        <div class="breakdown-row" data-star="5">
                            <span class="star-label">5 ★</span>
                            <div class="bar-bg"><div class="bar-fill" style="width: 0%"></div></div>
                            <span class="count-label">0</span>
                        </div>
                        <div class="breakdown-row" data-star="4">
                            <span class="star-label">4 ★</span>
                            <div class="bar-bg"><div class="bar-fill" style="width: 0%"></div></div>
                            <span class="count-label">0</span>
                        </div>
                        <div class="breakdown-row" data-star="3">
                            <span class="star-label">3 ★</span>
                            <div class="bar-bg"><div class="bar-fill" style="width: 0%"></div></div>
                            <span class="count-label">0</span>
                        </div>
                        <div class="breakdown-row" data-star="2">
                            <span class="star-label">2 ★</span>
                            <div class="bar-bg"><div class="bar-fill" style="width: 0%"></div></div>
                            <span class="count-label">0</span>
                        </div>
                        <div class="breakdown-row" data-star="1">
                            <span class="star-label">1 ★</span>
                            <div class="bar-bg"><div class="bar-fill" style="width: 0%"></div></div>
                            <span class="count-label">0</span>
                        </div>
                    </div>

                    <p class="review-permission" id="review-permission" role="status"></p>
                    <button class="review-retry" id="review-permission-retry" type="button" data-i18n="detail.reviewRetry" hidden>Try again</button>
                    
                    <fieldset class="summary-write" id="review-fields" disabled>
                        <legend class="write-review-title" data-i18n="detail.writeReview">Write a Review</legend>
                        <span class="write-review-sub" data-i18n="detail.rating">Tap a star to rate:</span>
                        
                        <div class="write-stars" id="write-stars">
                            <button type="button" data-value="1" aria-label="1 star" aria-pressed="false">★</button>
                            <button type="button" data-value="2" aria-label="2 stars" aria-pressed="false">★</button>
                            <button type="button" data-value="3" aria-label="3 stars" aria-pressed="false">★</button>
                            <button type="button" data-value="4" aria-label="4 stars" aria-pressed="false">★</button>
                            <button type="button" data-value="5" aria-label="5 stars" aria-pressed="false">★</button>
                        </div>

                        <div class="review-textarea-wrapper">
                            <textarea id="review-comment" class="review-textarea" maxlength="1000" aria-label="Review" placeholder="Write your thoughts about this product..."></textarea>
                            <div class="char-counter"><span id="review-char-count">0</span>/1000</div>
                        </div>

                        <div class="review-upload-box">
                            <label class="review-photo-label" for="review-photos">
                                <span class="upload-icon">📷</span>
                                <span data-i18n="detail.reviewPhotos">Add Photos (optional)</span>
                                <small>JPG, PNG or WebP up to 5MB (Max 5)</small>
                            </label>
                            <input id="review-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
                        </div>

                        <button id="review-clear-photos" class="review-clear-photos" type="button" data-i18n="detail.reviewClearPhotos" hidden>Remove all photos</button>
                        <div class="review-photo-previews" id="review-photo-previews"></div>
                    </fieldset>
                    
                    <p class="review-feedback" id="review-feedback" role="status" hidden></p>
                    <button class="btn-submit-review" id="btn-submit-review" type="button" disabled>Submit Review</button>
                </div>
                
                <!-- Review List Right -->
                <div class="reviews-list-wrapper">
                    <div class="reviews-list" id="product-reviews-list"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Xem Ảnh Phóng To -->
    <div id="review-image-modal" class="review-modal" hidden>
        <span class="review-modal-close" id="review-modal-close">&times;</span>
        <img class="review-modal-content" id="review-modal-img" alt="Enlarged review photo">
    </div>

    <sugar-footer></sugar-footer>
    
    <script src="/assets/js/api-config.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/product-reviews.js"></script>
    <script src="/assets/js/product-detail.js"></script>
</body>
</html>
