<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Product Detail</title>
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/product-detail.css">
</head>
<body>
    <sugar-header active="products"></sugar-header>

    <main class="page-shell">
        <div class="detail-container">
            <div class="detail-images">
                <div class="main-image">
                    <img id="main-product-image" src="/assets/images/cake1.png" alt="Product Image">
                </div>
                <div class="thumbnail-list" id="product-thumbnail-list" aria-label="Product images"></div>
            </div>

            <div class="detail-info">
                <span class="detail-label">Product Detail</span>
                
                <h1 class="detail-title" id="product-title-price"></h1>
                
                <ul class="detail-specs">
                    <li>⚖️ Weight: <span id="product-weight"></span></li>
                    <li>📅 Expiration date: <span id="product-exp"></span></li>
                    <li>🌾 Ingredient: <span id="product-ingredients"></span></li>
                </ul>

                <div class="detail-description">
                    <h3>Description</h3>
                    <p id="product-desc"></p>
                </div>

                <div class="detail-actions">
                    <div class="quantity-selector">
                        <button type="button" onclick="updateQty(-1)" aria-label="Decrease quantity">&minus;</button>
                        <input type="number" id="qty-input" value="1" min="1" readonly>
                        <button type="button" onclick="updateQty(1)" aria-label="Increase quantity">+</button>
                    </div>
                    <button class="btn-favourite" id="favorite-detail-button" type="button" aria-pressed="false">&#9825; Favourites</button>
                    <button class="btn-add-cart" type="button" onclick="addProductToCart(this)">Add To Cart</button>
                </div>
            </div>
        </div>

        <div class="related-section">
            <div class="related-header">
                <h2>Product you may like</h2>
            </div>
            <div class="related-grid" id="related-products">
            </div>
        </div>
    </main>

    <sugar-footer></sugar-footer>
    <script src="/assets/js/api-config.js"></script>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/product-detail.js"></script>
</body>
</html>
