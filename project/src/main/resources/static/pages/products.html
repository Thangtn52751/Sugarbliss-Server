<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Products</title>
    <link rel="stylesheet" href="/assets/css/product.css">
</head>
<body>
    <sugar-header active="products"></sugar-header>

    <main>
        <div class="products-banner">
            <img src="/assets/images/banner.jpg" alt="Sugar Bliss banner background" data-i18n-attr="alt:products.altBanner">
            <h1 data-i18n="products.bannerTitle">Discover Our Online Products</h1>
        </div>

        <div class="products-layout">
            <aside class="products-sidebar">
                <div class="products-controls">
                    <form class="products-filter-form" data-product-filters>
                        <label><span data-i18n="products.minPrice">Price from (VND)</span><input id="products-min-price" name="minPrice" type="number" min="0" max="9007199254740991" step="1" inputmode="numeric" placeholder="0"></label>
                        <label><span data-i18n="products.maxPrice">Price to (VND)</span><input id="products-max-price" name="maxPrice" type="number" min="0" max="9007199254740991" step="1" inputmode="numeric"></label>
                        <label class="products-sort-field"><span data-i18n="products.sortLabel">Sort by</span><select id="products-sort" name="sort">
                            <option value="default" data-i18n="products.sortDefault">Recommended</option>
                            <option value="price_asc" data-i18n="products.sortLowHigh">Price: Low to high</option>
                            <option value="price_desc" data-i18n="products.sortHighLow">Price: High to low</option>
                        </select></label>
                        <button class="products-filter-apply" type="submit" data-i18n="products.applyFilter">Apply</button>
                        <button class="products-filter-reset" type="button" data-clear-product-filters data-i18n="products.clearFilter">Clear filters</button>
                    </form>
                    <p class="products-filter-error" data-product-filter-error role="alert" hidden></p>
                    <p class="products-result-count" data-products-result-count role="status"></p>
                </div>
                <ul id="category-list" data-category-list></ul>
            </aside>
            <div class="products-content">
                <section class="products-main" id="products-container" data-products-container></section>
                <div class="products-pagination"><button class="products-filter-reset" type="button" data-products-more data-i18n="products.loadMore" hidden>Load more</button></div>
            </div>
        </div>
    </main>

    <sugar-footer></sugar-footer>
    <script src="/assets/js/api-config.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/products.js"></script>
</body>
</html>
