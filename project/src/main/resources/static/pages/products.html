<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Products</title>
    <link rel="stylesheet" href="/assets/css/product.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/home" aria-label="Sugar Bliss home">
            <img src="/assets/icons/logo.png" alt="Sugar Bliss logo">
            <span>Sugar Bliss</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="/home">About Us</a>
            <a class="active" href="/products">Products</a>
            <a href="/special-orders">Special Orders</a>
            <a href="/contact">Contact</a>
            <a class="profile-link" href="/profile" aria-label="Account"></a>
        </nav>
    </header>

    <main>
        <div class="products-banner">
            <img src="/assets/images/banner.jpg" alt="Sugar Bliss banner background">
            <h1>Discover Our Online Products</h1>
        </div>

        <div class="products-layout">
            <aside class="products-sidebar">
                <ul id="category-list" data-category-list></ul>
            </aside>

            <section class="products-main" id="products-container" data-products-container></section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-brand">
            <a class="footer-logo" href="/home" aria-label="Sugar Bliss home">
                <img src="/assets/icons/logo.png" alt="Sugar Bliss logo">
                <span>Sugar Bliss</span>
            </a>
            <p>Crafting bliss in every single bite.</p>
        </div>

        <div class="footer-visit">
            <h2>Visit Us</h2>
            <p><span class="footer-icon location" aria-hidden="true"></span>123 HaNoi VietNam</p>
            <p><span class="footer-icon phone" aria-hidden="true"></span>0123456789</p>
        </div>
    </footer>

    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/products.js"></script>
</body>
</html>
