<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Profile</title>
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/profile.css">
</head>
<body>
    <sugar-header active="profile"></sugar-header>

    <main class="profile-page">
        <section class="profile-hero">
            <button class="profile-avatar" type="button" data-profile-avatar aria-label="Upload avatar">SB</button>
            <input class="avatar-input" type="file" accept="image/*" data-avatar-input>
            <h1 data-profile-name>Sugar Bliss Customer</h1>
            <p data-profile-email>customer@sugarbliss.com</p>
        </section>

        <section class="profile-content">
            <form class="profile-card profile-form" data-profile-form>
                <div class="profile-card-heading">
                    <h2 data-i18n="profile.personalDetails">Personal Details</h2>
                    <p data-i18n="profile.personalSubtitle">Update your account details and delivery address.</p>
                </div>

                <div class="form-grid two-columns">
                    <label>
                        <span data-i18n="profile.firstName">First Name</span>
                        <input type="text" name="firstName" autocomplete="given-name">
                    </label>

                    <label>
                        <span data-i18n="profile.lastName">Last Name</span>
                        <input type="text" name="lastName" autocomplete="family-name">
                    </label>
                </div>

                <label>
                    <span data-i18n="profile.email">Email Address</span>
                    <input type="email" name="email" autocomplete="email" readonly>
                </label>

                <label>
                    <span data-i18n="profile.phone">Phone Number</span>
                    <input type="tel" name="phone" autocomplete="tel">
                </label>

                <label>
                    <span data-i18n="profile.address">Address</span>
                    <input type="text" name="address" autocomplete="street-address">
                </label>

                <label>
                    <span data-i18n="profile.dob">Date of Birth</span>
                    <input type="date" name="dateOfBirth">
                </label>

                <p class="profile-message" data-profile-message></p>

                <div class="profile-actions">
                    <button class="save-button" type="submit" data-i18n="profile.save">Save Changes</button>
                    <button class="cancel-button" type="button" data-profile-cancel data-i18n="profile.cancel">Cancel</button>
                </div>
            </form>

            <div class="profile-side">
                <section class="profile-card recent-orders">
                    <div class="section-title-row">
                        <h2 data-i18n="profile.recentOrders">Recent Orders</h2>
                        <a href="/orders" data-i18n="profile.viewAll">View All</a>
                    </div>
                    <div class="orders-list" data-profile-orders></div>
                </section>

                <section class="profile-card favorites-card">
                    <h2 data-i18n="profile.favorites">My Favorites</h2>
                    <div class="favorites-grid" data-profile-favorites></div>
                </section>
            </div>
        </section>
    </main>

    <sugar-footer></sugar-footer>
    <script src="/assets/js/api-config.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/shared-components.js"></script>
    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/profile.js?v=2"></script>
</body>
</html>
