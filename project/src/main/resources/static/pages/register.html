<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Register</title>
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <main class="login-page register-page">
        <section class="cake-panel" aria-label="Sugar Bliss cake preview">
            <img class="cake-image" src="/assets/images/cake1.png" alt="Sugar Bliss cake">
        </section>

        <section class="form-panel" aria-label="Register form">
            <div class="login-card register-card">
                <div class="brand">
                    <img class="brand-logo" src="/assets/icons/logo.png" alt="Sugar Bliss logo">
                    <span class="brand-name">Sugar Bliss</span>
                </div>

                <form class="login-form" action="http://localhost:3000/api/users/register" method="post" data-auth-form="register">
                    <label class="field">
                        <span class="sr-only">Email</span>
                        <input type="email" name="email" placeholder="Your Email" autocomplete="email" required>
                    </label>

                    <label class="field">
                        <span class="sr-only">Password</span>
                        <input type="password" name="password" placeholder="Your Password" autocomplete="new-password" required>
                    </label>

                    <label class="field">
                        <span class="sr-only">Confirm password</span>
                        <input type="password" name="confirmPassword" placeholder="Confirm Your Password" autocomplete="new-password" required>
                    </label>

                    <button class="submit-button" type="submit">Submit</button>
                </form>

                <p class="form-message" data-form-message></p>

                <p class="register-text">
                    Already Have A Account? <a href="/login">Login Now</a>
                </p>
            </div>
        </section>
    </main>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
