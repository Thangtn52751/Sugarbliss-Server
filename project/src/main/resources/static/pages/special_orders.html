<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bliss | Special Orders</title>
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/form-pages.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/home" aria-label="Sugar Bliss home">
            <img src="/assets/icons/logo.png" alt="Sugar Bliss logo">
            <span>Sugar Bliss</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="/home">About Us</a>
            <a href="/products">Products</a>
            <a class="active" href="/special-orders">Special Orders</a>
            <a href="/contact">Contact</a>
            <a class="profile-link" href="/profile" aria-label="Account"></a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-page-inner">
            <div class="form-heading">
                <h1>Special Order Form</h1>
                <p>Please fill out the form and someone from our team will get back to you within 24 hours.</p>
            </div>

            <form class="bliss-form" data-bliss-form="special-order" novalidate>
                <label class="bliss-field">
                    <span class="sr-only">Email</span>
                    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
                </label>

                <label class="bliss-field">
                    <span class="sr-only">Phone Number</span>
                    <input type="tel" name="phone" placeholder="Phone Number" autocomplete="tel" required>
                </label>

                <label class="bliss-field">
                    <span class="sr-only">Name</span>
                    <input type="text" name="name" placeholder="Name" autocomplete="name" required>
                </label>

                <label class="bliss-field bliss-select">
                    <span class="sr-only">Choose a delivery option</span>
                    <select name="deliveryOption" data-delivery-select required>
                        <option value="" selected disabled>Choose a delivery option</option>
                        <option value="pickup">Store Pickup</option>
                        <option value="local-delivery">Local Delivery</option>
                        <option value="shipping">Nationwide Shipping</option>
                    </select>
                </label>

                <div class="form-row">
                    <label class="bliss-field">
                        <span class="sr-only">Address 1</span>
                        <input type="text" name="address1" placeholder="Address 1" autocomplete="address-line1" required>
                    </label>
                    <label class="bliss-field">
                        <span class="sr-only">Address 2</span>
                        <input type="text" name="address2" placeholder="Address 2" autocomplete="address-line2">
                    </label>
                </div>

                <div class="form-row">
                    <label class="bliss-field">
                        <span class="sr-only">City</span>
                        <input type="text" name="city" placeholder="City" autocomplete="address-level2" required>
                    </label>
                    <label class="bliss-field">
                        <span class="sr-only">Zip Code</span>
                        <input type="text" name="zipCode" placeholder="Zip Code" autocomplete="postal-code" required>
                    </label>
                </div>

                <label class="bliss-field">
                    <span class="sr-only">Order Details</span>
                    <textarea name="orderDetails" placeholder="Order Details" required></textarea>
                </label>

                <p class="form-message" data-form-message></p>

                <div class="bliss-submit">
                    <button class="submit-button" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer form-footer">
        <div class="footer-brand">
            <a class="footer-logo" href="/home" aria-label="Sugar Bliss home">
                <img src="/assets/icons/logo.png" alt="Sugar Bliss logo">
                <span>Sugar Bliss</span>
            </a>
            <p>Crafting bliss in every single bite.</p>
        </div>

        <div class="footer-visit">
            <h2>Visit Us</h2>
            <p><span class="footer-icon location" aria-hidden="true"></span>123 HaNoi VietNam</p>
            <p><span class="footer-icon phone" aria-hidden="true"></span>0123456789</p>
            <div class="footer-follow">
                <span>Follow Us</span>
                <div class="social-links">
                    <a href="https://facebook.com" target="_blank" rel="noreferrer" aria-label="Facebook">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.5 8.5h2.5V5h-2.5C11.6 5 10 6.8 10 9.6V11H8v3.5h2V21h3.6v-6.5H16L16.6 11H13.6V9.7c0-.7.4-1.2.9-1.2Z"/></svg>
                    </a>
                    <a href="https://linkedin.com" target="_blank" rel="noreferrer" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 9H3.7v11.2h2.8V9Zm.2-4.1A1.7 1.7 0 1 0 3.4 6.6a1.7 1.7 0 0 0 3.3-1.7ZM20.3 13.2c0-3.3-1.8-4.8-4.1-4.8a3.5 3.5 0 0 0-3.1 1.6h-.1V9H10.3v11.2h2.8v-6c0-1.6.3-3.1 2.3-3.1s2.1 1.8 2.1 3.2v5.9h2.8v-6Z"/></svg>
                    </a>
                    <a href="https://instagram.com" target="_blank" rel="noreferrer" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.4"/><circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>
    <script src="/assets/js/header-profile.js"></script>
    <script src="/assets/js/form-pages.js"></script>
</body>
</html>
